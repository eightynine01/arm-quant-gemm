# `vmmlaq_s32` (FEAT_I8MM) and `vdotq_s32` (FEAT_DotProd) are still behind
# `stdarch_neon_i8mm` / `stdarch_neon_dotprod`, so this crate needs nightly.
#
# Pinning it here rather than telling people to type `cargo +nightly` is not a
# convenience. A fresh clone built with a default stable toolchain fails on the
# first line of main.rs:
#
#   error[E0554]: `#![feature]` may not be used on the stable release channel
#
# That is what a judge who follows the submission text hits, and it was invisible
# from here because this machine's default toolchain is nightly — the documented
# one-liner worked every time it was tried. rustup reads this file and selects
# the channel per directory, so `cargo run --release` now works verbatim
# regardless of what the reader's default is.
[toolchain]
channel = "nightly"
